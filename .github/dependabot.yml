version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: quarterly
    ignore:
      # Jekyll is pinned until we decide what to do about https://github.com/cohere-coop/ncmanager-guides/issues/9
      - dependency-name: jekyll
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      all:
        patterns: ["*"]
